name: Secret Scan

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-scan:
    name: Fast Scan (GBM re-ranker)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run fast secret scan
        id: scan
        uses: ./.github/actions/secret-scanner-action
        with:
          target: '.'
          mode: 'fast'
          sarif-output: 'fast-scan.sarif'

      - name: Print summary
        if: always()
        run: |
          echo "BLOCK=${{ steps.scan.outputs.blocked }}"
          echo "WARN=${{ steps.scan.outputs.warned }}"
          echo "STATUS=${{ steps.scan.outputs.status }}"

  deep-llm-scan:
    name: Deep LLM Scan (CodeBERT + UniXcoder)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache model bundle
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ~/.secret-scanner-model
          key: secret-scanner-model-v1

      - name: Run deep LLM secret scan
        id: scan
        uses: ./.github/actions/secret-scanner-action
        with:
          target: '.'
          mode: 'llm'
          sarif-output: 'llm-scan.sarif'

      - name: Print summary
        if: always()
        run: |
          echo "BLOCK=${{ steps.scan.outputs.blocked }}"
          echo "WARN=${{ steps.scan.outputs.warned }}"
          echo "STATUS=${{ steps.scan.outputs.status }}"